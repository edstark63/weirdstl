{{ define "main" }}
<div class="masonry-grid">
  {{ $stories := where .Site.RegularPages "Type" "in" (slice "historical" "current") }}
  {{ $featured := where (where .Site.RegularPages "Type" "event") "Params.featured" true }}
  {{ range ($stories | union $featured).ByDate.Reverse }}
    {{ partial "card.html" . }}
  {{ end }}
</div>
{{ end }}
